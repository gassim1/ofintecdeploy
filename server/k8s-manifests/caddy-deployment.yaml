apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s-manifests/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: caddy
  name: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: caddy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s-manifests/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: caddy
    spec:
      containers:
        - env:
            - name: ACME_EMAIL
              value: it@example.com
            - name: DESK_DOMAIN
              value: localhost
          image: caddy:2.10-alpine
          name: caddy
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          resources:
            limits:
              memory: "268435456"
          volumeMounts:
            - mountPath: /etc/caddy/Caddyfile
              name: caddy-cm0
              readOnly: true
              subPath: Caddyfile
            - mountPath: /data
              name: caddy-data
            - mountPath: /config
              name: caddy-config
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: Caddyfile
                path: Caddyfile
            name: caddy-cm0
          name: caddy-cm0
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: caddy-config
          persistentVolumeClaim:
            claimName: caddy-config
