apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s-manifests/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: engine
  name: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: engine
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s-manifests/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: engine
    spec:
      containers:
        - env:
            - name: DESK_MODE
              value: server
            - name: DESK_PUBLIC_URL
              value: https://localhost
          envFrom:
            - configMapRef:
                name: env
          image: ofintech-desk:local
          name: engine
          ports:
            - containerPort: 8700
              protocol: TCP
          resources:
            limits:
              memory: "2147483648"
          securityContext:
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/lib/ofintech-desk
              name: desk-data
            - mountPath: /tmp
              name: engine-tmpfs0
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: desk-data
          persistentVolumeClaim:
            claimName: desk-data
        - emptyDir:
            medium: Memory
          name: engine-tmpfs0
